<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AIニュースまとめ</title>
<style>
:root{--bg:#F1F3F2;--surface:#fff;--ink:#1E2A32;--mute:#5A6872;--line:#D9DFE2;--bright:#E0A02A;--dark:#4B3F9E;--neutral:#6B7C85;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#12181C;--surface:#1B242A;--ink:#E8EEF1;--mute:#9AA9B3;--line:#2A363D;--bright:#F2B544;--dark:#A99CFF;--neutral:#9FB0B8;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;line-height:1.7}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.7rem;font-weight:900;margin:8px 0 2px}
.meta{color:var(--mute);font-size:.85rem;margin:0 0 14px}
.badge{display:inline-block;padding:0 8px;border:1px solid var(--line);border-radius:99px;font-size:.78rem}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.seg{display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.seg button,.nav button{font:inherit;font-size:.88rem;border:0;background:var(--surface);color:var(--mute);padding:6px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:700}
.nav{display:flex;align-items:center;gap:6px;font-size:.9rem}
.nav button{border:1px solid var(--line);border-radius:8px;padding:4px 10px}
.nav button:disabled{opacity:.35;cursor:default}
.bar [hidden],.tabs[hidden]{display:none}
.tabs{display:flex;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;z-index:5}
.tab{flex:1;font:inherit;font-weight:700;font-size:.95rem;padding:10px 4px;border:1px solid var(--line);background:color-mix(in srgb,var(--c) 18%,var(--surface));color:var(--ink);border-radius:10px;cursor:pointer}
.tab .n{font-weight:400;margin-left:4px}
.tab[aria-selected="true"]{background:color-mix(in srgb,var(--c) 32%,var(--surface));border-color:var(--c);box-shadow:inset 0 -3px 0 var(--c)}
button:focus-visible,a:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.lead{color:var(--mute);font-size:.88rem;margin:10px 0 14px}
article{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:6px;padding:14px 16px;margin-bottom:12px}
.thumb{flex:none;width:64px;height:64px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:1.7rem;background:color-mix(in srgb,var(--c) 22%,var(--surface))}
.body{flex:1;min-width:0}
h2{font-size:1.02rem;font-weight:700;line-height:1.5;margin:0 0 6px}
h2 a{color:inherit;text-decoration:none}
article p{margin:0 0 8px;font-size:.9rem}
.src{display:flex;justify-content:space-between;gap:8px;font-size:.8rem;color:var(--mute)}
.others{font-size:.78rem;color:var(--mute);margin-top:4px}
.others a{color:var(--ink)}
.empty{color:var(--mute);padding:24px 0}
</style>
</head>
<body>
<main>
<h1>AIニュースまとめ</h1>
<p class="meta"><span class="badge">毎朝8:00更新</span></p>
<div class="bar"><div class="seg" id="seg"><button data-p="day" aria-pressed="true">日別</button><button data-p="week" aria-pressed="false">週間</button><button data-p="month" aria-pressed="false">月間</button></div><div class="nav" id="nav"><button id="prev" aria-label="前の日">◀</button><span id="date"></span><button id="next" aria-label="次の日">▶</button></div></div>
<div class="tabs" role="tablist" id="tabs"></div>
<p class="lead" id="lead"></p>
<section id="list" aria-live="polite"></section>
</main>
<script>
var CATS=[
{id:"bright",label:"☀️明るい",icon:"☀️",color:"var(--bright)",lead:"新しい技術や成果、活用事例のニュース"},
{id:"dark",label:"🫥暗い",icon:"🫥",color:"var(--dark)",lead:"情報漏洩、事故、悪用、規制強化などのニュース"},
{id:"neutral",label:"🤔中立",icon:"🤔",color:"var(--neutral)",lead:"明暗どちらとも言えない、または両面があるニュース"}];
var dates=[],cache={},per="day",pos=0,cur="bright",tabs=document.getElementById("tabs");
function esc(x){return String(x).replace(/[&<>"]/g,function(m){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]})}
function safe(u){return /^https?:\/\//.test(u)?u:"#"}
function load(d){return cache[d]?Promise.resolve(cache[d]):fetch("data/"+d+".json").then(function(r){return r.json()}).then(function(x){return cache[d]=x})}
function card(g,i,rank){
var c=CATS.filter(function(k){return k.id===g.category})[0]||CATS[2];
var o=(g.others||[]).map(function(x){return '<a href="'+safe(x.link)+'" target="_blank" rel="noopener">'+esc(x.source)+'</a>'}).join(" / ");
return '<article style="--c:'+c.color+'"><div class="thumb" aria-hidden="true">'+c.icon+'</div><div class="body"><h2>'+(rank?(i+1)+'位 ':'')+'<a href="'+safe(g.link)+'" target="_blank" rel="noopener">'+esc(g.title)+'</a></h2><p>'+esc(g.summary||"")+'</p><div class="src"><span>'+esc(g.source)+'</span><strong>'+g.count+'媒体が報道</strong></div>'+(o?'<div class="others">ほかの報道: '+o+'</div>':'')+'</div></article>'}
function render(){
Array.prototype.forEach.call(document.querySelectorAll("#seg button"),function(b){b.setAttribute("aria-pressed",b.dataset.p===per)});
var list=document.getElementById("list"),isDay=per==="day";
tabs.hidden=!isDay;document.getElementById("nav").hidden=!isDay;
if(!dates.length){list.innerHTML='<p class="empty">まだデータがありません。毎朝8時の更新のあとに表示されます。</p>';return}
if(isDay){
var d=dates[pos];document.getElementById("date").textContent=d;
document.getElementById("prev").disabled=pos>=dates.length-1;document.getElementById("next").disabled=pos===0;
load(d).then(function(day){
var gs=day.groups;
tabs.innerHTML=CATS.map(function(c){var n=gs.filter(function(g){return g.category===c.id}).length;return '<button class="tab" role="tab" style="--c:'+c.color+'" aria-selected="'+(c.id===cur)+'" data-id="'+c.id+'">'+c.label+'<span class="n">'+n+'</span></button>'}).join("");
var cat=CATS.filter(function(c){return c.id===cur})[0];
document.getElementById("lead").textContent=cat.lead;
var f=gs.filter(function(g){return g.category===cur});
list.innerHTML=f.length?f.map(function(g,i){return card(g,i,false)}).join(""):'<p class="empty">この区分の記事はありません。</p>'})
}else{
var n=per==="week"?7:30;
document.getElementById("lead").textContent="全分野を、報じた媒体数の多い順に表示します(直近"+n+"日)";
Promise.all(dates.slice(0,n).map(load)).then(function(days){
var all=[];days.forEach(function(day){day.groups.forEach(function(g){all.push({g:g,d:day.date})})});
all.sort(function(a,b){return b.g.count-a.g.count||(a.d<b.d?1:-1)});
list.innerHTML=all.slice(0,30).map(function(x,i){return card(x.g,i,true)}).join("")})}}
tabs.addEventListener("click",function(e){var b=e.target.closest(".tab");if(b){cur=b.dataset.id;render()}});
document.getElementById("seg").addEventListener("click",function(e){var b=e.target.closest("button");if(b){per=b.dataset.p;render()}});
document.getElementById("prev").onclick=function(){if(pos<dates.length-1){pos++;render()}};
document.getElementById("next").onclick=function(){if(pos>0){pos--;render()}};
fetch("data/index.json").then(function(r){return r.json()}).then(function(x){dates=x;render()}).catch(function(){render()});
</script>
</body>
</html>
